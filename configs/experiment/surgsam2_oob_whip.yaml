# @package _global_
# Out-of-box SurgSAM-2 evaluation on the whip cohort with manual boxes.
# This is the ablation baseline (no whip-specific finetuning).
#
# Run: python -m pipeline run +experiment=surgsam2_oob_whip
defaults:
  - override /scope: whip_all
  - override /stage1_prompting: manual_box
  - override /stage2_inference: surgsam2

name: surgsam2_oob_whip_v1
description: SurgSAM-2 (endo18 finetune) on whip, manual_box prompts, no whip-FT
