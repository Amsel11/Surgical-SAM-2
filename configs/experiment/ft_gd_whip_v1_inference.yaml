# @package _global_
# Ablation: fine-tuned Grounding DINO Stage-1 + SAM 3 Stage-2.
# The headline FT condition. Only difference from zs_gd_whip_v1_inference
# is `stage1_prompting.checkpoint` — same prompter, same SAM3, same scope,
# so the ablation diff comes down to a single config line.
#
# Prereqs:
#   - FT'd weights produced by slurm/ft_gd_train.sh (Phase 4), saved as a
#     standard HF model directory at checkpoints/gdino_whip_ft_v1/
#     (transformers from_pretrained loads a dir exactly like a model id).
#   - All Phase 0/1 prereqs from zs_gd_whip_v1_inference (vocab + .gdino_venv).
#   - Generate FT prompt_sets at seed=2 (see scope.seed below):
#       run_dino_prompter --all-cohort whip --seed 2 \
#           --checkpoint checkpoints/gdino_whip_ft_v1
#     (or let the orchestrator generate them on demand — _resolve_dino runs the
#     prompter with this checkpoint when no seed=2 dino prompt_set exists yet).
#
# Run (in .sam3_venv):
#   python -m pipeline run +experiment=ft_gd_whip_v1_inference
#
# COLLISION NOTE: prompt_sets are keyed (video, seed, method) and _resolve_dino
# reuses an existing same-key prompt_set regardless of checkpoint. So ZS and FT
# would clobber each other at the same seed. We sidestep that by pinning the FT
# arm to scope.seed=2 (ZS stays at seed=1) — distinct prompt_sets AND distinct
# results/.../seed_<k>/ output dirs, so the ablation arms never overwrite. The
# cleaner fix (checkpoint-tagged prompt_sets) is deferred to the ablation harness.

name: dino_ft_whip_v1
description: FT Grounding DINO Stage-1 (HF-native), SAM 3 OOB Stage-2, whip cohort

scope:
  # seed=2 keeps the FT arm's prompt_sets + masks separate from the ZS arm
  # (seed=1). See the COLLISION NOTE above.
  seed: 2

stage1_prompting:
  method: dino
  # HF-native FT output: a model directory. transformers from_pretrained loads
  # a local dir the same way it loads a hub model id, so the prompter needs no
  # code change — only this path differs from the zero-shot arm.
  checkpoint: ${oc.env:BP_REPO,.}/checkpoints/gdino_whip_ft_v1
  box_threshold: 0.35
  text_threshold: 0.25

stage2_inference:
  model: sam3
  checkpoint: ${oc.env:BP_REPO,.}/checkpoints/sam3/sam3.pt
  config: null
