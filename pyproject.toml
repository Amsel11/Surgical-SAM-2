[project]
name = "surgsam2-pipeline"
version = "0.1.0"
description = "Surgical video segmentation pipeline (SurgSAM-2, SAM2.1, SAM3) for ablation studies on the whip cohort"
authors = [{name = "Annelene Schulze", email = "annelene.schulze@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # SAM2 / SAM3 model stack
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    # Image / video I/O
    "numpy>=1.24.4,<2.0",
    "pillow>=10.0",
    "tqdm>=4.66.1",
    "opencv-python>=4.7",
    "imageio-ffmpeg>=0.4",
    "scikit-image>=0.21",
    # Pipeline / config / DB
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
clicker = [
    "gradio>=5.0,<6.0",
    "gradio_image_annotation",
]
notebooks = [
    "matplotlib>=3.9.1",
    "jupyter>=1.0.0",
    "ipympl",
    "eva-decord>=0.6.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
]
# Meta's SAM2 training extras, kept verbatim for upstream parity.
sam2-train = [
    "fvcore>=0.1.5.post20221221",
    "tensorboard>=2.17.0",
    "pycocotools>=2.0.8",
    "tensordict>=0.6.0",
    "submitit>=1.5.1",
]

# Entry point will be added in Phase B once pipeline/__main__.py exists:
# [project.scripts]
# surgsam2 = "pipeline.__main__:main"

[build-system]
requires = ["setuptools>=68", "torch>=2.5.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "sam2*"]
exclude = ["notebooks*", "tests*", "tools*"]

[tool.setuptools.package-data]
sam2 = ["*.yaml", "**/*.yaml", "csrc/*.cu"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# E501 = line too long; keep informational only (line-length above is advisory).
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = false
